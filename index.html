<!DOCTYPE html>
<html>
<head>
  <title>N-chant</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>

  <div id="login">
    <h2>Login</h2>
    <input type="tel" id="mobile" placeholder="Enter Mobile Number">
    <button onclick="login()">Start Game</button>
  </div>

  <div id="menu" class="hidden">
    <h2>Select Mode</h2>
    <button onclick="startGame('random')">Randomness</button>
    <button onclick="startGame('speed')">Speed</button>
  </div>

  <div id="game" class="hidden">
    <h3>Score: <span id="score">0</span></h3>
    <h3>Time: <span id="time">30</span></h3>
    <div id="gameArea"></div>
  </div>

<script src="script.js"></script>
</body>
</html>
